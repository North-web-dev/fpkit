services:
  inspect:
    build: .
    image: ghcr.io/north-web-dev/fpkit:latest
    command: ["inspect", "--addr", ":8443"]
    ports:
      - "8443:8443"
    restart: unless-stopped

  hook:
    image: ghcr.io/north-web-dev/fpkit:latest
    command: ["hook", "--addr", ":8443"]
    ports:
      - "8444:8443"
    restart: unless-stopped
    profiles: ["hook"]
